# Build manifest — replayed by the netlinux dev pipeline.
# Not auto-triggered in GHA; use `gh workflow run release-deb.yml` to
# run manually on a GitHub-hosted runner.
name: Build .deb package (dual-suite)
true:
  push:
    branches:
    - netlinux
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
        - target: bookworm
          container: debian:bookworm
        - target: resolute
          container: ubuntu:26.04
    runs-on: ubuntu-24.04
    container:
      image: ${{ matrix.container }}
    steps:
    - name: Bootstrap container
      run: "apt-get update\napt-get install -y --no-install-recommends \\\n  ca-certificates curl git xz-utils zstd \\\n \
        \ build-essential dpkg-dev sudo\n"
    - uses: actions/checkout@v4
    - name: Install build dependencies
      run: "apt-get update\napt-get install -y \\\n  build-essential pkg-config meson ninja-build \\\n  xfce4-dev-tools \\\
        \n  libgtk-3-dev libglib2.0-dev libcairo2-dev \\\n  libxfce4ui-2-dev libxfce4util-dev libxfconf-0-dev \\\n  libwnck-3-dev\
        \ \\\n  libx11-dev libxinerama-dev libxi-dev libxres-dev \\\n  libxext-dev libepoxy-dev libstartup-notification0-dev\
        \ \\\n  libxrender-dev libxcomposite-dev libxdamage-dev \\\n  libxfixes-dev libxrandr-dev libxpresent-dev \\\n  xfce4-dev-tools\
        \ gobject-introspection \\\n  libgirepository1.0-dev \\\n  librsvg2-dev librsvg2-common\n"
    - name: Configure
      run: 'meson setup build --prefix=/usr --buildtype=release

        '
    - name: Build
      run: ninja -C build
    - name: Determine version
      id: version
      run: 'ver=$(meson introspect build --projectinfo | python3 -c "import sys,json; print(json.load(sys.stdin)[''version''])")

        # Strip -dev suffix if present

        ver=$(echo "$ver" | sed ''s/-dev$//'')

        rev=${{ github.run_number }}

        echo "version=${ver}-${rev}netlinux1~${{ matrix.target }}1" >> "$GITHUB_OUTPUT"

        echo "tag=v${ver}-${rev}netlinux1~${{ matrix.target }}1" >> "$GITHUB_OUTPUT"

        '
    - name: Package with checkinstall
      run: "apt-get install -y checkinstall\ncheckinstall --default \\\n  --pkgname=xfwm4 \\\n  --pkgversion=\"${{ steps.version.outputs.version\
        \ }}\" \\\n  --requires=\"libgtk-3-0t64,libglib2.0-0t64,libwnck-3-0,libxfce4ui-2-0,libxfce4util7,libxfconf-0-3,libepoxy0,libstartup-notification0,libxcomposite1,libxdamage1,libxfixes3,libxrandr2,libxrender1,libxres1,libxpresent1,libxinerama1,libx11-6,libxext6\"\
        \ \\\n  --maintainer=\"graham@netlinux.co.uk\" \\\n  --pakdir=. \\\n  --install=no \\\n  --fstrans=no \\\n  ninja\
        \ -C build install\n"
    - name: Repack .deb for reprepro compatibility
      run: "DEB=$(ls xfwm4_*.deb)\nchmod 666 \"$DEB\"\nmkdir repack && cd repack\nar x \"../$DEB\"\nfor f in *.zst; do\n \
        \ [ -f \"$f\" ] || continue\n  zstd -d \"$f\"\n  xz \"${f%.zst}\"\n  rm \"$f\"\ndone\nrm \"../$DEB\"\nar rcs \"../$DEB\"\
        \ debian-binary control.tar.xz data.tar.xz\n"
    - uses: actions/upload-artifact@v4
      with:
        name: deb-${{ matrix.target }}
        path: '**/*.deb

          '
        if-no-files-found: error
  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
    - uses: actions/download-artifact@v4
      with:
        path: artifacts
    - name: Compute tag
      id: tag
      run: echo "tag=v${{ github.run_number }}-dualsuite" >> "$GITHUB_OUTPUT"
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.tag.outputs.tag }}
        name: Build ${{ github.run_number }} (bookworm + resolute)
        body: 'Dual-suite build from commit ${{ github.sha }}.

          Both ~bookworm1 and ~resolute1 .debs are attached.

          '
        files: artifacts/**/*.deb
        fail_on_unmatched_files: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: Notify package repository
      run: "sleep 5\nPAYLOAD='{\"repo\":\"netlinux-ai/xfwm4\",\"tag\":\"${{ steps.tag.outputs.tag }}\"}'\nSIGNATURE=$(echo\
        \ -n \"$PAYLOAD\" \\\n  | openssl dgst -sha256 -hmac \"${{ secrets.WEBHOOK_SECRET }}\" -binary \\\n  | xxd -p -c 256)\n\
        curl -sf -X POST \\\n  -H \"Content-Type: application/json\" \\\n  -H \"X-Webhook-Signature: sha256=${SIGNATURE}\"\
        \ \\\n  -d \"$PAYLOAD\" \\\n  https://packages.netlinux.co.uk/webhook/update-repo\n"
'on':
  workflow_dispatch: null
